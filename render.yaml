services:
  - type: web
    name: render-otp-webhook
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: APP_NAME
        value: Render OTP Dispatcher
      - key: DEDUP_CACHE_TTL
        value: "300"

