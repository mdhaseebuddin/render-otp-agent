services:
  - type: web
    name: velotest-otp-webhook
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: SENDER_EMAIL
        value: velotest2026@gmail.com
      - key: WEBHOOK_SECRET
        sync: false
      - key: APP_NAME
        value: VeloTest
      - key: DEDUP_CACHE_TTL
        value: "300"
