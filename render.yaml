services:
  - type: web
    name: velotest-otp-webhook
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_API_KEY_FALLBACK
        sync: false
      - key: SENDER_EMAIL
        value: mdhaseebuddin24@gmail.com
      - key: SENDER_NAME
        value: VeloTest Security
      - key: WEBHOOK_SECRET
        sync: false
      - key: APP_NAME
        value: VeloTest Security
      - key: DEDUP_CACHE_TTL
        value: "300"
