services:
  - type: web
    name: velotest-otp-webhook
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: EMAIL_PROVIDER
        value: auto
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: VeloTest Verification
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: APP_NAME
        value: VeloTest Verification
      - key: DEDUP_CACHE_TTL
        value: "300"
